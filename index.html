<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saudi Scanner Pro</title>
<style>
:root{
  --bg:#07090d;--surface:#0d1117;--surface2:#111820;--surface3:#18222e;
  --border:#1c2a38;--border2:#243447;
  --gold:#d4a843;--gold2:#f0c060;--gold-dim:rgba(212,168,67,0.13);
  --green:#22c55e;--green-dim:rgba(34,197,94,0.1);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.1);
  --blue:#3b82f6;--cyan:#06b6d4;--cyan-dim:rgba(6,182,212,0.1);
  --orange:#f97316;--orange-dim:rgba(249,115,22,0.1);
  --purple:#a855f7;--purple-dim:rgba(168,85,247,0.1);
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;direction:rtl}

/* ─── HEADER ─── */
header{position:sticky;top:0;z-index:100;background:rgba(7,9,13,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--gold),#b8860b);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-text{font-size:15px;font-weight:800;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:10px;color:var(--text3);margin-top:1px}
.header-actions{display:flex;align-items:center;gap:8px}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--green-dim);border:1px solid rgba(34,197,94,.2);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--green);font-weight:600}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:700;border:none;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,var(--gold),#b8860b);color:#000}
.btn-gold:hover{opacity:.88;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.scan-time{font-size:11px;color:var(--text3)}

/* ─── LAYOUT ─── */
.container{max-width:1440px;margin:0 auto;padding:16px 20px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.panel-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.panel-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ─── IND CARDS ─── */
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.ind-grid{grid-template-columns:1fr}}
.ind-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.ind-card.disabled{opacity:.45;pointer-events:none}
.ind-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ind-label{display:flex;align-items:center;gap:8px}
.ind-name{font-size:15px;font-weight:800;color:var(--gold2)}
.ind-badge{font-size:11px;color:var(--text3);background:var(--surface3);border:1px solid var(--border2);border-radius:5px;padding:2px 7px;cursor:pointer}
.ind-badge:hover{border-color:var(--gold);color:var(--gold)}

/* ─── TOGGLE ─── */
.toggle{position:relative;display:inline-flex;align-items:center;cursor:pointer;width:38px;height:21px}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.t-track{position:absolute;inset:0;background:#1e2d3d;border-radius:21px;transition:.2s}
.toggle input:checked~.t-track{background:var(--gold)}
.t-thumb{position:absolute;left:3px;top:3px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.2s;z-index:1}
.toggle input:checked~.t-thumb{left:20px}

/* ─── TF ROWS ─── */
.tf-rows{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.tf-row{display:flex;align-items:center;gap:8px;min-height:32px}
.tf-chip{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid var(--border2);background:var(--surface3);color:var(--text3);cursor:pointer;transition:.15s;min-width:66px;text-align:center;position:relative}
.tf-chip .ck{display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--gold)}
.tf-chip.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold2)}
.tf-chip.on .ck{display:block}
.tf-extras{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tf-extras.hidden{display:none}

/* ─── EXTRA BTNS ─── */
.ex-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:.15s;white-space:nowrap;background:var(--surface3)}
.ex-btn.sma50{color:var(--cyan);border-color:rgba(6,182,212,.2)}
.ex-btn.sma50.on{background:var(--cyan-dim);border-color:var(--cyan)}
.ex-btn.zero{color:var(--orange);border-color:rgba(249,115,22,.2)}
.ex-btn.zero.on{background:var(--orange-dim);border-color:var(--orange)}
.ex-btn.cross{color:var(--purple);border-color:rgba(168,85,247,.2)}
.ex-btn.cross.on{background:var(--purple-dim);border-color:var(--purple)}
.ex-btn.trig{color:var(--gold2);border-color:rgba(212,168,67,.2)}
.ex-btn.trig.on{background:var(--gold-dim);border-color:var(--gold)}
.num-input{width:36px;padding:2px 4px;border-radius:4px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:11px;text-align:center;font-family:var(--font)}

/* ─── STOCH PARAMS ─── */
.stoch-params-box{display:none;margin-bottom:10px;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--surface3);border-radius:7px;border:1px solid var(--border)}
.stoch-params-box.open{display:flex}
.param-label{font-size:11px;color:var(--text3)}
.param-input{width:44px;padding:3px 5px;border-radius:5px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:12px;text-align:center;font-family:var(--font)}

/* ─── RESULTS ─── */
.results-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.res-count{font-size:20px;font-weight:800;color:var(--gold2)}
.res-label{font-size:13px;color:var(--text3)}
.sort-row{display:flex;gap:6px;margin-right:auto}
.sort-btn{padding:4px 11px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--border2);background:var(--surface2);color:var(--text3);cursor:pointer;transition:.15s}
.sort-btn.on{border-color:var(--gold);color:var(--gold2);background:var(--gold-dim)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:8px 10px;color:var(--text3);font-size:11px;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid rgba(28,42,56,.4);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.015)}
.sym-cell{font-weight:800;color:var(--gold2)}
.name-cell{color:var(--text2);font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sect-tag{font-size:10px;background:var(--surface3);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--text3)}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--text2)}
.sig{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap}
.sig-trig{background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.sig-pos{background:rgba(212,168,67,.1);color:var(--gold2);border:1px solid rgba(212,168,67,.2)}
.score-wrap{display:flex;align-items:center;gap:6px}
.bar-bg{width:48px;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
.bar-fill{height:5px;border-radius:3px}

/* ─── LOADING ─── */
.overlay{position:fixed;inset:0;background:rgba(7,9,13,.9);backdrop-filter:blur(10px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.overlay.show{display:flex}
.ov-title{font-size:18px;font-weight:700;color:var(--gold2)}
.prog-track{width:280px;height:6px;background:var(--surface3);border-radius:4px;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0%;transition:.3s;border-radius:4px}
.ov-sub{font-size:13px;color:var(--text3)}

/* ─── STRATEGIES ─── */
.strat-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.strat-input{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);padding:7px 12px;font-size:13px;font-family:var(--font);flex:1;min-width:140px}
.strat-list{display:flex;flex-direction:column;gap:8px}
.strat-item{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;flex-wrap:wrap}
.strat-name{font-weight:700;font-size:13px;color:var(--gold2);flex:1;min-width:100px}
.strat-meta{font-size:11px;color:var(--text3)}
.strat-active-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.mini-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--surface3);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s}
.mini-btn:hover{border-color:var(--gold);color:var(--gold)}
.mini-btn.del{border-color:rgba(239,68,68,.3);color:var(--red)}
.mini-btn.del:hover{background:var(--red-dim)}
.no-strat{font-size:13px;color:var(--text3);padding:10px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:10px 18px;font-size:13px;z-index:300;opacity:0;transition:.3s;pointer-events:none;color:var(--text)}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="ov-title">🔍 جارٍ فحص السوق...</div>
  <div class="prog-track"><div class="prog-bar" id="progBar"></div></div>
  <div class="ov-sub" id="progCount">0 / 0</div>
</div>
<div class="toast" id="toast"></div>

<header>
  <div class="logo">
    <div class="logo-icon">📡</div>
    <div>
      <div class="logo-text">Saudi Scanner Pro</div>
      <div class="logo-sub">كامل السوق · <span id="totalCnt">—</span> سهم</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="live-badge"><div class="live-dot"></div>تداول</div>
    <span class="scan-time" id="scanTime"></span>
    <button class="btn btn-outline" onclick="runScan()">🔍 فحص يدوي</button>
    <button class="btn btn-gold" onclick="saveStrategy()">💾 حفظ استراتيجية</button>
  </div>
</header>

<div class="container">

<!-- ── INDICATORS PANEL ── -->
<div class="panel">
  <div class="panel-title">إعدادات المؤشرات</div>
  <div class="ind-grid">

    <!-- ══ DMA CARD ══ -->
    <div class="ind-card" id="dmaCard">
      <div class="ind-header">
        <div class="ind-label">
          <span class="ind-name">DMA</span>
          <span class="ind-badge">10 · 50 · 10</span>
        </div>
        <label class="toggle"><input type="checkbox" id="dmaOn" checked onchange="syncCard('dma')"><div class="t-track"></div><div class="t-thumb"></div></label>
      </div>
      <div class="tf-rows">

        <!-- شهري -->
        <div class="tf-row">
          <button class="tf-chip" id="dma-M" onclick="toggleTF('dma','M')"><div class="ck">✓</div>شهري</button>
          <div class="tf-extras hidden" id="dma-M-ex">
            <button class="ex-btn sma50" id="dma-M-sma" onclick="toggleEx(this)">SMA 50</button>
            <button class="ex-btn zero" id="dma-M-zero" onclick="toggleEx(this)">DIF > 0</button>
          </div>
        </div>

        <!-- أسبوعي -->
        <div class="tf-row">
          <button class="tf-chip" id="dma-W" onclick="toggleTF('dma','W')"><div class="ck">✓</div>أسبوعي</button>
          <div class="tf-extras hidden" id="dma-W-ex">
            <button class="ex-btn sma50" id="dma-W-sma" onclick="toggleEx(this)">SMA 50</button>
            <button class="ex-btn zero" id="dma-W-zero" onclick="toggleEx(this)">DIF > 0</button>
          </div>
        </div>

        <!-- يومي -->
        <div class="tf-row">
          <button class="tf-chip" id="dma-D" onclick="toggleTF('dma','D')"><div class="ck">✓</div>يومي</button>
          <div class="tf-extras hidden" id="dma-D-ex">
            <button class="ex-btn sma50" id="dma-D-sma" onclick="toggleEx(this)">SMA 50</button>
            <button class="ex-btn zero" id="dma-D-zero" onclick="toggleEx(this)">DIF > 0</button>
            <button class="ex-btn trig" id="dma-D-trig" onclick="toggleEx(this)">⚡ زناد</button>
          </div>
        </div>

      </div>
    </div>

    <!-- ══ STOCH CARD ══ -->
    <div class="ind-card" id="stochCard">
      <div class="ind-header">
        <div class="ind-label">
          <span class="ind-name">Stochastic</span>
          <span class="ind-badge" id="stochBadge" onclick="toggleStochEdit()">5 · 3 · 3</span>
        </div>
        <label class="toggle"><input type="checkbox" id="stochOn" checked onchange="syncCard('stoch')"><div class="t-track"></div><div class="t-thumb"></div></label>
      </div>

      <!-- Stoch params edit -->
      <div class="stoch-params-box" id="stochParamsBox">
        <span class="param-label">K</span>
        <input class="param-input" type="number" id="stochK" value="5" min="1" max="50" oninput="updateStochBadge()">
        <span class="param-label">D</span>
        <input class="param-input" type="number" id="stochD" value="3" min="1" max="20" oninput="updateStochBadge()">
        <span class="param-label">Smooth</span>
        <input class="param-input" type="number" id="stochS" value="3" min="1" max="20" oninput="updateStochBadge()">
      </div>

      <div class="tf-rows">

        <!-- شهري -->
        <div class="tf-row">
          <button class="tf-chip" id="stoch-M" onclick="toggleTF('stoch','M')"><div class="ck">✓</div>شهري</button>
          <div class="tf-extras hidden" id="stoch-M-ex">
            <button class="ex-btn sma50" id="stoch-M-sma" onclick="toggleEx(this)">SMA 50</button>
            <button class="ex-btn cross" id="stoch-M-cross" onclick="toggleEx(this)">K &lt; <input class="num-input" type="number" id="stoch-M-cv" value="30" min="1" max="99" onclick="event.stopPropagation()"></button>
          </div>
        </div>

        <!-- أسبوعي -->
        <div class="tf-row">
          <button class="tf-chip" id="stoch-W" onclick="toggleTF('stoch','W')"><div class="ck">✓</div>أسبوعي</button>
          <div class="tf-extras hidden" id="stoch-W-ex">
            <button class="ex-btn sma50" id="stoch-W-sma" onclick="toggleEx(this)">SMA 50</button>
            <button class="ex-btn cross" id="stoch-W-cross" onclick="toggleEx(this)">K &lt; <input class="num-input" type="number" id="stoch-W-cv" value="30" min="1" max="99" onclick="event.stopPropagation()"></button>
          </div>
        </div>

        <!-- يومي -->
        <div class="tf-row">
          <button class="tf-chip" id="stoch-D" onclick="toggleTF('stoch','D')"><div class="ck">✓</div>يومي</button>
          <div class="tf-extras hidden" id="stoch-D-ex">
            <button class="ex-btn sma50" id="stoch-D-sma" onclick="toggleEx(this)">SMA 50</button>
            <button class="ex-btn cross" id="stoch-D-cross" onclick="toggleEx(this)">K &lt; <input class="num-input" type="number" id="stoch-D-cv" value="30" min="1" max="99" onclick="event.stopPropagation()"></button>
            <button class="ex-btn trig" id="stoch-D-trig" onclick="toggleEx(this)">⚡ زناد</button>
          </div>
        </div>

      </div>
    </div>

  </div><!-- /ind-grid -->
</div><!-- /panel -->

<!-- ── RESULTS PANEL ── -->
<div class="panel">
  <div class="results-meta">
    <span class="res-count" id="resCount">—</span>
    <span class="res-label">سهم مطابق</span>
    <div class="sort-row">
      <button class="sort-btn on" onclick="setSort('score',this)">الأقوى</button>
      <button class="sort-btn" onclick="setSort('chg',this)">التغيير</button>
      <button class="sort-btn" onclick="setSort('sym',this)">الرمز</button>
    </div>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead><tr id="tHead"></tr></thead>
      <tbody id="tBody">
        <tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text3)">
          <div style="font-size:32px;margin-bottom:10px">📊</div>
          اضغط "فحص يدوي" للبدء<br>
          <span style="font-size:11px">يفحص كامل أسهم تداول السعودي</span>
        </td></tr>
      </tbody>
    </table>
  </div>
  <div style="margin-top:10px;font-size:11px;color:var(--text3)" id="statsRow"></div>
</div>

<!-- ── STRATEGIES PANEL ── -->
<div class="panel">
  <div class="panel-title">الاستراتيجيات المحفوظة</div>
  <div class="strat-form">
    <input class="strat-input" id="stratName" placeholder="اسم الاستراتيجية...">
    <input class="strat-input" id="stratEmail" placeholder="إيميل التنبيه (اختياري)">
    <button class="btn btn-gold" onclick="saveStrategy()">💾 حفظ</button>
  </div>
  <div class="strat-list" id="stratList">
    <span class="no-strat">لا توجد استراتيجيات محفوظة بعد — احفظ استراتيجية لبدء الفحص التلقائي</span>
  </div>
</div>

</div><!-- /container -->

<script>
// ══════════════════════════════════════════════════
//  MARKET DATA
// ══════════════════════════════════════════════════
const SECTORS={banking:'البنوك',energy:'الطاقة',materials:'المواد الأساسية',telecom:'الاتصالات',real_estate:'العقارات',retail:'التجزئة',healthcare:'الرعاية الصحية',food:'الأغذية',insurance:'التأمين',utilities:'المرافق',transport:'النقل',media:'الإعلام',hotel:'الفنادق',capital:'الاستثمار',pharma:'الأدوية',agri:'الزراعة',construction:'المقاولات'};
const RAW_MARKET=[
  {sym:'1010',name:'بنك الرياض',s:'banking'},{sym:'1020',name:'بنك الجزيرة',s:'banking'},
  {sym:'1030',name:'البنك السعودي الفرنسي',s:'banking'},{sym:'1050',name:'البنك البريطاني السعودي',s:'banking'},
  {sym:'1060',name:'البنك السعودي للاستثمار',s:'banking'},{sym:'1080',name:'البنك العربي الوطني',s:'banking'},
  {sym:'1120',name:'مصرف الراجحي',s:'banking'},{sym:'1140',name:'البنك الأهلي السعودي',s:'banking'},
  {sym:'1150',name:'بنك الرياض',s:'banking'},{sym:'1180',name:'الأول',s:'banking'},
  {sym:'1214',name:'شاكر',s:'banking'},{sym:'1302',name:'بنك الخليج الدولي',s:'banking'},
  {sym:'2030',name:'بترو رابغ',s:'energy'},{sym:'2222',name:'أرامكو السعودية',s:'energy'},
  {sym:'2310',name:'المتقدمة للحفر',s:'energy'},{sym:'2380',name:'بابكو',s:'energy'},
  {sym:'2001',name:'المصافي',s:'materials'},{sym:'2010',name:'سابك',s:'materials'},
  {sym:'2020',name:'الصناعات الكيماوية',s:'materials'},{sym:'2040',name:'صدق',s:'materials'},
  {sym:'2050',name:'سافكو',s:'materials'},{sym:'2060',name:'ينساب',s:'materials'},
  {sym:'2070',name:'المجموعة السعودية',s:'materials'},{sym:'2080',name:'الدمام للأنابيب',s:'materials'},
  {sym:'2090',name:'ميبكو',s:'materials'},{sym:'2100',name:'أميانتيت',s:'materials'},

function riyadhNow(){
  return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Riyadh'}));
}
function dateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function marketOpen(){
  const r=riyadhNow(),t=r.getHours()*60+r.getMinutes();
  return r.getDay()>=0&&r.getDay()<=4&&t>=600&&t<=930;
}
function lastTradingDay(){
  const r=riyadhNow();
  const d=new Date(r);
  if(!marketOpen()) d.setDate(d.getDate()-1);
  while(d.getDay()===5||d.getDay()===6) d.setDate(d.getDate()-1);
  return dateStr(d);
}

async function apiFetch(path,params={}){
  const url=new URL('/api/sahmk',window.location.origin);
  url.searchParams.set('path',path);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const r=await fetch(url.toString());
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

//  CANDLE BUILDER
// ══════════════════════════════════════════════════
function buildCandles(daily,tf){
  if(tf==='D') return daily;
  const g={};
  for(const c of daily){
    const d=new Date(c.date);
    let key;
    if(tf==='W'){
      const ws=new Date(d); ws.setDate(d.getDate()-d.getDay());
      key=dateStr(ws);
    } else {
      key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    }
    if(!g[key]) g[key]=[];
    g[key].push(c);
  }
  return Object.entries(g).sort(([a],[b])=>a.localeCompare(b)).map(([key,cs])=>({
    date:tf==='W'?key:key+'-01',
    open:parseFloat(cs[0].open),
    high:Math.max(...cs.map(c=>parseFloat(c.high))),
    low:Math.min(...cs.map(c=>parseFloat(c.low))),
    close:parseFloat(cs[cs.length-1].close),
    volume:cs.reduce((s,c)=>s+parseFloat(c.volume||0),0),
  }));
}

async function fetchStock(sym){
  const r=riyadhNow();
  const to=dateStr(r);
  const from=new Date(r); from.setFullYear(from.getFullYear()-7);
  const data=await apiFetch(`historical/${sym}`,{period:'daily',from:dateStr(from),to});
  const raw=(data?.data||data?.results||[]).filter(c=>{
    const dw=new Date(c.date).getDay(); return dw!==5&&dw!==6;
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(raw.length<15) return null;

  // تحقق آخر يوم تداول
  const lastDate=raw[raw.length-1]?.date?.split('T')[0];
  const ltd=lastTradingDay();
  const diff=(new Date(ltd)-new Date(lastDate))/(86400000);
  if(diff>7) return null;

  // شمعة حية أثناء السوق
  const working=[...raw];
  if(marketOpen()){
    try{
      const q=await apiFetch(`quote/${sym}`);
      if(q?.price){
        const lp=parseFloat(q.price);
        const live={date:dateStr(riyadhNow()),open:parseFloat(q.open||lp),high:parseFloat(q.high||lp),low:parseFloat(q.low||lp),close:lp,volume:0,adjusted_close:lp};
        const ld=working[working.length-1]?.date?.split('T')[0];
        if(ld===live.date) working[working.length-1]=live; else working.push(live);
      }
    }catch(e){}
  }

  // بناء الإطارات
  const tfData={};
  for(const tf of ['D','W','M']){
    const built=buildCandles(working,tf).sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(built.length<2) continue;
    tfData[tf]={closes:built.map(c=>c.close),highs:built.map(c=>c.high),lows:built.map(c=>c.low)};
  }

  const dc=tfData['D']?.closes||[];
  const price=dc[dc.length-1]||0;
  const prev=dc[dc.length-2]||price;
  const chg=prev?+((price-prev)/prev*100).toFixed(2):0;
  return {sym,price,chg,tfData};
}

// ══════════════════════════════════════════════════
//  INDICATORS
// ══════════════════════════════════════════════════
function calcDMA(closes){
  const n=closes.length;
  if(n<62) return null;
  const sma=(arr,p,i)=>arr.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p;
  const dif=[];
  for(let i=49;i<n;i++) dif.push(sma(closes,10,i)-sma(closes,50,i));
  if(dif.length<12) return null;
  const k=2/11;
  let sig=dif.slice(0,10).reduce((a,b)=>a+b,0)/10;
  const sigs=[sig];
  for(let i=10;i<dif.length;i++){sig=dif[i]*k+sig*(1-k);sigs.push(sig);}
  const ni=dif.length-1,ns=sigs.length-1;
  return{curDif:dif[ni],curSig:sigs[ns],prevDif:dif[ni-1],prevSig:sigs[ns-1],
    isPos:dif[ni]>sigs[ns],isCross:dif[ni-1]<sigs[ns-1]&&dif[ni]>sigs[ns]};
}

function calcStoch(highs,lows,closes,kP,sl,dP){
  const n=closes.length;
  if(n<kP+sl+dP+2) return null;
  const rawK=[];
  for(let i=kP-1;i<n;i++){
    const hh=Math.max(...highs.slice(i-kP+1,i+1));
    const ll=Math.min(...lows.slice(i-kP+1,i+1));
    rawK.push(hh===ll?50:((closes[i]-ll)/(hh-ll))*100);
  }
  const sK=[];
  for(let i=sl-1;i<rawK.length;i++) sK.push(rawK.slice(i-sl+1,i+1).reduce((a,b)=>a+b,0)/sl);
  const D=[];
  for(let i=dP-1;i<sK.length;i++) D.push(sK.slice(i-dP+1,i+1).reduce((a,b)=>a+b,0)/dP);
  if(sK.length<2||D.length<2) return null;
  const curK=sK[sK.length-1],curD=D[D.length-1];
  const prevK=sK[sK.length-2],prevD=D[D.length-2];
  return{curK,curD,prevK,prevD,isPos:curK>curD,isCross:prevK<prevD&&curK>curD};
}

function aboveSMA50(closes){
  const n=closes.length;
  if(n<50) return false;
  const s=closes.slice(n-50).reduce((a,b)=>a+b,0)/50;
  return closes[n-1]>s;
}

function getSettings(){
  const dmaOn=document.getElementById('dmaOn').checked;
  const stochOn=document.getElementById('stochOn').checked;
  const dmaTFs=['M','W','D'].filter(tf=>isOn(`dma-${tf}`));
  const stochTFs=['M','W','D'].filter(tf=>isOn(`stoch-${tf}`));
  return{
    dmaOn, stochOn, dmaTFs, stochTFs,
    dmaTrig: dmaOn&&isOn('dma-D-trig'),
    stochTrig: stochOn&&isOn('stoch-D-trig'),
    dmaEx:{
      M:{sma:isOn('dma-M-sma'),zero:isOn('dma-M-zero')},
      W:{sma:isOn('dma-W-sma'),zero:isOn('dma-W-zero')},
      D:{sma:isOn('dma-D-sma'),zero:isOn('dma-D-zero')},
    },
    stochEx:{
      M:{sma:isOn('stoch-M-sma'),cross:isOn('stoch-M-cross'),cv:+document.getElementById('stoch-M-cv').value||30},
      W:{sma:isOn('stoch-W-sma'),cross:isOn('stoch-W-cross'),cv:+document.getElementById('stoch-W-cv').value||30},
      D:{sma:isOn('stoch-D-sma'),cross:isOn('stoch-D-cross'),cv:+document.getElementById('stoch-D-cv').value||30},
    },
    stochK:+document.getElementById('stochK').value||5,
    stochD:+document.getElementById('stochD').value||3,
    stochS:+document.getElementById('stochS').value||3,
  };
}

function evalDMA(stock,cfg){
  if(!cfg.dmaOn||cfg.dmaTFs.length===0) return null;
  for(const tf of cfg.dmaTFs){
    const d=stock.tfData[tf];
    if(!d) return false;
    const s=calcDMA(d.closes);
    if(!s) return false;
    const ex=cfg.dmaEx[tf];
    // شرط SMA50
    if(ex.sma&&!aboveSMA50(d.closes)) return false;
    // شرط DIF>0
    if(ex.zero&&s.curDif<=0) return false;
    // شرط الإطار الزمني
    if(tf==='D'&&cfg.dmaTrig){
      // زناد: تقاطع في آخر شمعة
      if(!s.isCross) return false;
    } else {
      // شرط: DIF فوق DIFMA
      if(!s.isPos) return false;
    }
  }
  return true;
}

function evalStoch(stock,cfg){
  if(!cfg.stochOn||cfg.stochTFs.length===0) return null;
  const {stochK:kP,stochS:sl,stochD:dP}=cfg;
  for(const tf of cfg.stochTFs){
    const d=stock.tfData[tf];
    if(!d) return false;
    const s=calcStoch(d.highs,d.lows,d.closes,kP,sl,dP);
    if(!s) return false;
    const ex=cfg.stochEx[tf];
    // شرط SMA50
    if(ex.sma&&!aboveSMA50(d.closes)) return false;
    // شرط مستوى K
    if(ex.cross&&s.curK>=ex.cv) return false;
    // شرط الإطار الزمني
    if(tf==='D'&&cfg.stochTrig){
      if(!s.isCross) return false;
    } else {
      if(!s.isPos) return false;
    }
  }
  return true;
}

function filterStock(stock,cfg){
  const dmaR=evalDMA(stock,cfg);
  const stochR=evalStoch(stock,cfg);
  const dmaActive=cfg.dmaOn&&cfg.dmaTFs.length>0;
  const stochActive=cfg.stochOn&&cfg.stochTFs.length>0;
  if(!dmaActive&&!stochActive) return false;
  if(dmaActive&&!stochActive) return dmaR===true;
  if(!dmaActive&&stochActive) return stochR===true;
  return dmaR===true&&stochR===true;
}

async function runScan(cfg=null,silent=false){
  const settings=cfg||getSettings();
  if(!silent){
    document.getElementById('overlay').classList.add('show');
    document.getElementById('progBar').style.width='0%';
  }
  const results=[];
  const total=MARKET.length;
  let done=0;
  for(let i=0;i<total;i+=BATCH){
    const batch=MARKET.slice(i,Math.min(i+BATCH,total));
    const settled=await Promise.allSettled(batch.map(async stk=>{
      try{
        const data=await fetchStock(stk.sym);
        if(!data||!filterStock(data,settings)) return null;
        // إشارات للعرض
        const dD=data.tfData['D'];
        const dmaD=dD?calcDMA(dD.closes):null;
        const stochD=dD?calcStoch(dD.highs,dD.lows,dD.closes,settings.stochK,settings.stochS,settings.stochD):null;
        const score=calcScore(evalDMA(data,settings),evalStoch(data,settings),settings);
        return{...stk,price:data.price,chg:data.chg,dmaD,stochD,score,_cfg:settings};
      }catch(e){return null;}
    }));
    settled.forEach(r=>{if(r.status==='fulfilled'&&r.value) results.push(r.value);});
    done+=batch.length;
    if(!silent){
      document.getElementById('progBar').style.width=Math.round(done/total*100)+'%';
      document.getElementById('progCount').textContent=`${done} / ${total}`;
    }
  }
  lastResults=results;
  if(!silent){
    renderTable(results,settings);
    buildHeader(settings);
    document.getElementById('scanTime').textContent=`آخر فحص: ${new Date().toLocaleTimeString('ar-SA')}`;
    setTimeout(()=>{document.getElementById('overlay').classList.remove('show');document.getElementById('progBar').style.width='0%';},400);
  }
  return results;
}

function calcScore(dmaR,stochR,cfg){
  let s=50;
  const dmaActive=cfg.dmaOn&&cfg.dmaTFs.length>0;
  const stochActive=cfg.stochOn&&cfg.stochTFs.length>0;
  if(dmaActive&&dmaR===true) s+=cfg.dmaTrig?35:25;
  if(stochActive&&stochR===true) s+=cfg.stochTrig?35:25;
  return Math.min(100,s);
}

// ══════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════
function buildHeader(cfg){
  const dmaActive=cfg.dmaOn&&cfg.dmaTFs.length>0;
  const stochActive=cfg.stochOn&&cfg.stochTFs.length>0;
  let h='<th>الرمز</th><th>الشركة</th><th>القطاع</th><th>السعر</th><th>التغيير%</th>';
  if(dmaActive) h+=`<th>DMA يومي${cfg.dmaTrig?' (زناد)':''}</th>`;
  if(stochActive) h+=`<th>Stoch يومي${cfg.stochTrig?' (زناد)':''}</th>`;
  h+='<th>الإشارة</th><th>القوة</th>';
  document.getElementById('tHead').innerHTML=h;
}

function renderTable(data,cfg){
  cfg=cfg||lastResults[0]?._cfg||getSettings();
  const sorted=[...data].sort((a,b)=>{
    if(currentSort==='chg') return Math.abs(b.chg)-Math.abs(a.chg);
    if(currentSort==='sym') return a.sym.localeCompare(b.sym);
    return b.score-a.score;
  });
  document.getElementById('resCount').textContent=sorted.length;
  if(!sorted.length){
    document.getElementById('tBody').innerHTML='<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text3)">لا توجد أسهم مطابقة للشروط</td></tr>';
    document.getElementById('statsRow').textContent='';
    return;
  }
  const dmaActive=cfg?.dmaOn&&cfg?.dmaTFs?.length>0;
  const stochActive=cfg?.stochOn&&cfg?.stochTFs?.length>0;
  let crossCount=0;
  document.getElementById('tBody').innerHTML=sorted.map(s=>{
    const pc=s.chg>0?'up':s.chg<0?'dn':'neu';
    const cs=s.chg>0?'+':'';
    const hasCross=(s.dmaD?.isCross||s.stochD?.isCross);
    if(hasCross) crossCount++;
    const color=s.score>=80?'var(--green)':s.score>=60?'var(--gold)':'var(--text3)';

    let dmaCol='',stochCol='';
    if(dmaActive&&s.dmaD){
      const c=s.dmaD.isCross,p=s.dmaD.isPos;
      dmaCol=`<td><span class="sig ${c?'sig-trig':'sig-pos'}">${c?'⚡ تقاطع':'✓ إيجابي'} <small style="opacity:.7">${s.dmaD.curDif.toFixed(2)}</small></span></td>`;
    } else if(dmaActive) dmaCol='<td>—</td>';

    if(stochActive&&s.stochD){
      const c=s.stochD.isCross;
      stochCol=`<td><span class="sig ${c?'sig-trig':'sig-pos'}">${c?'⚡':'✓'} K=${s.stochD.curK.toFixed(1)}</span></td>`;
    } else if(stochActive) stochCol='<td>—</td>';

    const overall=hasCross?'<span class="sig sig-trig">⚡ تقاطع</span>':'<span class="sig sig-pos">✓ إيجابي</span>';
    return `<tr>
      <td class="sym-cell">${s.sym}</td>
      <td class="name-cell" title="${s.name}">${s.name}</td>
      <td><span class="sect-tag">${s.sectorAr}</span></td>
      <td class="${pc}" style="font-weight:700">${s.price.toFixed(2)}</td>
      <td class="${pc}">${cs}${s.chg.toFixed(2)}%</td>
      ${dmaCol}${stochCol}
      <td>${overall}</td>
      <td><div class="score-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${s.score}%;background:${color}"></div></div><span style="font-size:11px;font-weight:700;color:${color}">${s.score}</span></div></td>
    </tr>`;
  }).join('');
  document.getElementById('statsRow').textContent=`إشارات دخول: ${crossCount} · شرط فقط: ${sorted.length-crossCount} · هالبة: 0 · إجمالي: ${sorted.length}`;
}

// ══════════════════════════════════════════════════
//  STRATEGIES
// ══════════════════════════════════════════════════
let strategies=[];
let autoScanTimer=null;

async function saveStrategy(){
  const name=document.getElementById('stratName').value.trim();
  if(!name){toast('اكتب اسماً للاستراتيجية','err');return;}
  const email=document.getElementById('stratEmail').value.trim();
  const snap=getSettings();
  const strat={id:Date.now().toString(),name,email,snap,active:true,date:new Date().toLocaleDateString('ar-SA')};
  try{
    const res=await fetch('/api/strategies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(strat)});
    const d=await res.json();
    strategies=d.strategies||[];
    renderStrategies();
    startAutoScan();
    toast('✅ تم الحفظ وبدأ الفحص التلقائي','ok');
    document.getElementById('stratName').value='';
  }catch(e){toast('فشل الحفظ','err');}
}

async function deleteStrategy(id){
  try{
    const res=await fetch('/api/strategies',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const d=await res.json();
    strategies=d.strategies||[];
    renderStrategies();
    if(!strategies.length) stopAutoScan();
    toast('تم الحذف','ok');
  }catch(e){toast('فشل الحذف','err');}
}

async function loadStrategies(){
  try{
    const d=await fetch('/api/strategies').then(r=>r.json());
    strategies=d.strategies||[];
    renderStrategies();
    if(strategies.length) startAutoScan();
  }catch(e){}
}

function renderStrategies(){
  const el=document.getElementById('stratList');
  if(!strategies.length){
    el.innerHTML='<span class="no-strat">لا توجد استراتيجيات محفوظة — احفظ استراتيجية لبدء الفحص التلقائي كل 5 دقائق</span>';
    return;
  }
  el.innerHTML=strategies.map(s=>`
    <div class="strat-item">
      <span class="strat-name">${s.name}</span>
      <span class="strat-meta">${s.date||''}</span>
      ${s.email?`<span class="strat-meta">📧 ${s.email}</span>`:''}
      <span class="strat-active-badge">🟢 تلقائي</span>
      <button class="mini-btn" onclick='applySnap(${JSON.stringify(s.snap)})'>تطبيق</button>
      <button class="mini-btn" onclick="runWithSnap('${s.id}')">فحص</button>
      <button class="mini-btn del" onclick="deleteStrategy('${s.id}')">حذف</button>
    </div>
  `).join('');
}

function applySnap(snap){
  // DMA
  document.getElementById('dmaOn').checked=snap.dmaOn;
  syncCard('dma');
  ['M','W','D'].forEach(tf=>{
    const on=snap.dmaTFs?.includes(tf);
    const btn=document.getElementById(`dma-${tf}`);
    const ex=document.getElementById(`dma-${tf}-ex`);
    btn?.classList.toggle('on',!!on);
    ex?.classList.toggle('hidden',!on);
    if(on&&snap.dmaEx?.[tf]){
      document.getElementById(`dma-${tf}-sma`)?.classList.toggle('on',!!snap.dmaEx[tf].sma);
      document.getElementById(`dma-${tf}-zero`)?.classList.toggle('on',!!snap.dmaEx[tf].zero);
    }
  });
  document.getElementById('dma-D-trig')?.classList.toggle('on',!!snap.dmaTrig);

  // Stoch
  document.getElementById('stochOn').checked=snap.stochOn;
  syncCard('stoch');
  ['M','W','D'].forEach(tf=>{
    const on=snap.stochTFs?.includes(tf);
    const btn=document.getElementById(`stoch-${tf}`);
    const ex=document.getElementById(`stoch-${tf}-ex`);
    btn?.classList.toggle('on',!!on);
    ex?.classList.toggle('hidden',!on);
    if(on&&snap.stochEx?.[tf]){
      document.getElementById(`stoch-${tf}-sma`)?.classList.toggle('on',!!snap.stochEx[tf].sma);
      document.getElementById(`stoch-${tf}-cross`)?.classList.toggle('on',!!snap.stochEx[tf].cross);
      const cv=document.getElementById(`stoch-${tf}-cv`);
      if(cv&&snap.stochEx[tf].cv) cv.value=snap.stochEx[tf].cv;
    }
  });
  document.getElementById('stoch-D-trig')?.classList.toggle('on',!!snap.stochTrig);
  if(snap.stochK) document.getElementById('stochK').value=snap.stochK;
  if(snap.stochD) document.getElementById('stochD').value=snap.stochD;
  if(snap.stochS) document.getElementById('stochS').value=snap.stochS;
  updateStochBadge();
  toast('✅ تم تطبيق الاستراتيجية');
}

async function runWithSnap(id){
  const strat=strategies.find(s=>s.id===id);
  if(!strat) return;
  applySnap(strat.snap);
  await runScan(strat.snap);
}

// ── AUTO SCAN ──
function startAutoScan(){
  stopAutoScan();
  autoScanTimer=setInterval(async()=>{
    if(!marketOpen()) return; // فقط أثناء السوق
    for(const s of strategies){
      const results=await runScan(s.snap,true);
      // إرسال تنبيه إذا وجد نتائج جديدة وعنده إيميل
      if(s.email&&results&&results.length>0){
        await sendAlert(s.email,s.name,results);
      }
    }
  },5*60*1000); // كل 5 دقائق
}
function stopAutoScan(){
  if(autoScanTimer) clearInterval(autoScanTimer);
  autoScanTimer=null;
}

// تحميل الاستراتيجيات
loadStrategies();
</script>
